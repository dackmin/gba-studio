name: Release to itch.io

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true

jobs:
  upload:
    name: Upload to itch.io
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      release_tag: ${{ steps.setup.outputs.releaseTag }}
    strategy:
      matrix:
        platform:
          - name: Windows (setup)
            label: windows
            dir: windows
            pattern: '*.exe'
          - name: Windows (portable)
            label: windows
            dir: windows-portable
            pattern: '*-win32-*.zip'
          - name: macOS
            label: osx
            dir: macos
            pattern: '*-macos-*.zip'
          - name: Linux (AppImage)
            label: linux
            dir: linux-appimage
            pattern: '*.AppImage'
          - name: Linux (deb)
            label: linux
            dir: linux-deb
            pattern: '*.deb'
          - name: Linux (rpm)
            label: linux
            dir: linux-rpm
            pattern: '*.rpm'
    steps:
      - name: Setup
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "releaseTag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "releaseTag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release file
        run: |
          gh release download --pattern '${{ matrix.platform.pattern }}' --dir ./release/${{ matrix.platform.dir }} ${{ steps.setup.outputs.releaseTag }}
      - name: Upload
        uses: Oval-Tutu/publish-to-itch-with-butler@1.0.0
        with:
          api-key: ${{ secrets.BUTLER_API_KEY }}
          itch_user: dackmin
          itch_game: gba-studio
          channel: ${{ matrix.platform.label }}
          package: ./release/${{ matrix.platform.dir }}
          version: ${{ steps.setup.outputs.releaseTag }}
